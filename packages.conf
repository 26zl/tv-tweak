# Package tiers for Fire TV Stick 4K Max (karat / AFTKRT), Fire OS 8.1.8.0.
# Format: <tier> <package>   [# note]
# Derived from `pm list packages` on the actual device, not a generic list.
# Memory figures are measured PSS from `dumpsys meminfo` on a running device.
#
# Tiers applied by default: ads promo ota cruft
# Opt-in tiers: alexa smarthome aggressive

# --- ads: content recognition, advertising, telemetry ---
ads	com.amazon.tv.acr		# automatic content recognition
ads	com.amazon.aca			# ACR companion: HDMI watcher + activity switch watcher, 15 MB
ads	com.amazon.hybridadidservice	# advertising ID
ads	com.amazon.device.telemetry.emitter
ads	com.amazon.wirelessmetrics.service
ads	com.amazon.perfc
ads	com.amazon.perfcollection
ads	com.amazon.dp.logger

