# --- alexa: voice remote stops working if you apply this tier ---
# Known limitation, verified on 8.1.8.0: com.amazon.vizzini re-enables itself, coming back as
# enabled=1 (explicitly enabled, not reset to default). Timing measured across one boot: still
# disabled at 185 s uptime, re-enabled by 238 s. So it is not the reboot itself — something in
# the Alexa stack re-enables it a few minutes into the session, which means re-running
# `debloat alexa` immediately after boot does not stick. Wait until the device has settled,
# then re-run and confirm with `verify`. The other six stay disabled.
# Suspected cause is a protected package holding CHANGE_COMPONENT_ENABLED_STATE
# (com.amazon.adep), which cannot itself be disabled — unconfirmed.
alexa	com.amazon.vizzini			# 47 MB
alexa	com.amazon.alexa.datastore.app		# 20 MB
alexa	com.amazon.alexamediaplayer.runtime.ftv	# 21 MB
alexa	com.amazon.alexadirectivebrokerservice
alexa	com.amazon.alexa.externalmediaplayer.fireos
alexa	com.amazon.tv.alexaalerts
alexa	com.amazon.tv.alexanotifications

# --- smarthome: Matter, Frustration Free Setup, Whisper* device discovery ---
smarthome	com.amazon.tv.matter
smarthome	com.amazon.tv.mattercohost
smarthome	com.amazon.smarthomemapviewapp
smarthome	com.amazon.whad			# 15 MB
smarthome	com.amazon.whasettings
smarthome	com.amazon.whisperjoin.middleware.v2.np	# 9.7 MB
smarthome	com.amazon.tv.ffsprovisioneeclient

# --- aggressive: measurable wins with real trade-offs, read each note ---
aggressive	com.amazon.cloud9	# Silk browser, 45 MB — only after TV Bro is installed
aggressive	com.amazon.imp		# install manager; disabling stops Appstore installs
aggressive	com.amazon.ceviche	# remote config + metrics delivery, 13 MB

# --- blocked: Fire OS refuses these for the shell UID ---
# Verified on 8.1.8.0: `pm disable-user` raises
#   java.lang.SecurityException: Cannot disable a protected package
# and `pm uninstall -k --user 0` returns DELETE_FAILED_INTERNAL_ERROR.
# Kept here as documentation. Applying this tier will fail on every line.
# Blocking these requires DNS/router filtering instead — see README.
blocked	com.amazon.device.software.ota		# 31 MB, still runs; OTA must be blocked at DNS
blocked	com.amazon.device.software.ota.override
blocked	com.amazon.client.metrics		# 16 MB
blocked	com.amazon.device.metrics
blocked	com.amazon.device.crashmanager
blocked	com.amazon.device.logmanager
blocked	com.amazon.device.sync
blocked	com.amazon.device.sync.sdk.internal
blocked	com.amazon.ftvads.deeplinking
blocked	com.amazon.tv.csapp
blocked	com.amazon.tv.parentalcontrols
blocked	com.fireos.usagestats.proxy
