# Applied by `tune`: <namespace> <key> <value>. Originals are recorded so `restore` can roll back.
# A fourth column names a tier: that line is applied by `debloat <tier>` instead, with the tier's packages.
global	window_animation_scale	0.0
global	transition_animation_scale	0.0
global	animator_duration_scale	0.0
secure	location_mode	0	# no location provider on a mains-powered HDMI stick has a legitimate consumer
global	ota_disable_automatic_update	1	ota	# with `debloat ota`: stops automatic firmware updates, security fixes included
