# Fire TV Stick 4K Max (karat / AFTKRT), Fire OS 8.1.8.0, armeabi-v7a. Shell syntax: sourced by tweak.sh.
model="AFTKRT"
device="karat"
tiers="ads promo ota cruft"
# Any of these resolving as HOME counts as a working launcher.
launcher="com.amazon.tv.launcher"
# Candidates for `verify --deep`; only the installed ones are launched.
media_apps="com.amazon.firebat com.netflix.ninja com.disney.disneyplus com.hbo.hbonow com.apple.atve.amazon.appletv org.xbmc.kodi com.amazon.avod com.wbd.stream com.spotify.tv.android"
# getprop key=value pairs that must hold for DRM playback.
props="init.svc.drm=running init.svc.mediadrm=running ro.vendor.amzn_drm.widevine=yes ro.vendor.amzn_drm.playready=yes ro.vendor.amzn_drm.hdcp1=yes"
