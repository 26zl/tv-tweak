# Applied by `tune`: <namespace> <key> <value>. Originals are recorded so `restore` can roll back.
global	window_animation_scale	0.0
global	transition_animation_scale	0.0
# animator_duration_scale is left out: com.mediatek.tv.agent writes 1.0 back within a minute of
# every boot.
secure	location_mode	0	# a wall-mounted TV has no use for a location fix
