# Package tiers for Sharp 4K UHDTV (MediaTek MT9676 / maniatika), Google TV on Android 14.
# Format: <tier> <package>   [# note]
# Derived from `pm list packages` on the actual device (164 enabled on a fresh set).
#
# Tiers applied by default: ads promo ota cruft
# Opt-in tiers: assistant cast

# --- ads: content recognition, advertising, telemetry ---
ads	tv.anoki.acr.anokiacroptin		# automatic content recognition: fingerprints whatever is on screen
ads	com.mtc.uploadcsr			# vendor crash/usage report uploader
ads	com.google.android.feedback		# Google crash/feedback uploader
ads	com.android.adservices.api		# Privacy Sandbox advertising APIs
ads	com.android.ondevicepersonalization.services
ads	com.android.federatedcompute.services
ads	com.android.tv.feedbackconsent
ads	com.google.android.partnersetup		# OEM partner hooks; only needed during first-run setup

# --- promo: preinstalled services and store surfaces ---
promo	com.amazon.amazonvideo.livingroom	# Prime Video
promo	com.google.android.play.games
promo	com.google.android.youtube.tvmusic
promo	com.mediatek.tv.retaildemo		# shop-floor demo loop

# --- ota: forced-update components that can be disabled ---
ota	com.mediatek.tv.systemupdater		# vendor firmware updater; Play/GMS updates are not affected
ota	com.android.dynsystem			# dynamic system update installer

# --- cruft ---
cruft	com.mtc.emanual				# on-screen manual
cruft	org.obs.mhegservice			# MHEG-5 interactive TV, UK/NZ only

# --- assistant (opt-in): voice remote and Assistant stop working ---
assistant	com.google.android.katniss	# Google Assistant / voice search

# --- cast (opt-in): phones can no longer cast or find the TV ---
cast	com.google.android.apps.mediashell	# Chromecast built-in
cast	com.mediatek.dialservice		# DIAL discovery for YouTube/Netflix casting
cast	com.mediatek.miracast
