name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck runs once, on ubuntu: the macOS runner does not ship it and the result would be
      # the same. macOS is here for its BSD userland and its /bin/sh.
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck tweak.sh test.sh test-flows.sh check-pins.sh
      - name: posix syntax
        run: sh -n tweak.sh && sh -n test.sh && sh -n test-flows.sh && sh -n check-pins.sh
      - name: self-test
        run: ./test.sh
      - name: flow tests
        run: ./test-flows.sh
