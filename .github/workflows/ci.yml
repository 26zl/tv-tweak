name: ci
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck firetweak.sh test.sh
      - name: posix syntax
        run: sh -n firetweak.sh && sh -n test.sh
      - name: self-test
        run: ./test.sh
